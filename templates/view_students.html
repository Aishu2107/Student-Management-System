<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
</head>
<body>

<h1>Students List</h1>

{% for student in students %}
<p><b>Name:</b> {{ student["name"] }}</p>
<p><b>Roll No:</b> {{ student["roll"] }}</p>
<p><b>Department:</b> {{ student["department"] }}</p>
<hr>
{% endfor %}

<a href="/">Back</a>

</body>
</html>
